# Frank CI (kiro-craft spec 12, requirement 5.1): every push and pull request runs the backend's property and unit
# tests against the same system libraries the deployed server uses, and type-checks and builds the frontend.
# No secrets are needed: tests that would reach a real service are written to work without one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Spec checker (ticked tasks have evidence, roadmap agrees)
        run: python3 scripts/check_specs.py
      - name: Architecture checker (no audio processing in the browser, keys server-side, versions kept)
        run: python3 scripts/check_architecture.py

  backend:
    runs-on: ubuntu-24.04   # package names match the server image; ubuntu-latest moved to 26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ENVIRONMENT: test
      NUMBA_CPU_NAME: generic
    steps:
      - uses: actions/checkout@v4
      - name: System audio libraries (as in backend/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth libfluidsynth3 ffmpeg librubberband2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest hypothesis
      - name: SoundFont (MIT, fetched, never committed)
        run: bash scripts/fetch_soundfont.sh
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests

  frontend:
    runs-on: ubuntu-24.04   # package names match the server image; ubuntu-latest moved to 26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build (includes lint)
        run: npx next build
